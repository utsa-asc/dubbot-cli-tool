version: 2
updates:
  # Keeps the commit-SHA pins in .github/workflows up to date (the release
  # shows in the trailing comment). Review each PR; do not auto-merge.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
